name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch + torchvision
        run: |
          python -m pip install --upgrade pip
          # Pin both to the CPU wheel index so that `pip install -e .` below
          # doesn't then re-resolve and pull the multi-GB CUDA build from PyPI.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: |
          pip install -e ".[dev]"

      - name: Show environment
        run: |
          python --version
          pip freeze | head -40

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short --color=yes

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            htmlcov/
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src/ scripts/ tests/ --output-format=github
