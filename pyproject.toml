[build-system]
# >=77 parses the PEP 639 `license = "MIT"` string below (older setuptools
# fail metadata generation, e.g. with --no-build-isolation); bdist_wheel is
# built into setuptools >=70.1, so no separate `wheel` requirement.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glaucoma-multimodal"
version = "0.1.0"
description = "GlaucoMamba: Two-tier glaucoma pipeline with DINOv2, BoundaryFormer, Delta-t Mamba, VF-GIN, and evidential uncertainty"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "transformers>=4.45",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.1",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "pre-commit>=3.5",
    "jupyter>=1.0",
    "ipykernel>=6.25",
    # tests/test_entry_points.py builds a wheel (Python 3.12+ venvs ship no
    # setuptools); >=77 reads the PEP 639 `license = "MIT"` string above.
    "setuptools>=77",
]
vlm = [
    "peft>=0.7",
    # load_in_4bit (configs/tier/specialist.yaml) needs bitsandbytes; transformers
    # 5.x (allowed by the unpinned transformers>=4.45 above) ignores <0.46.1.
    # bitsandbytes>=0.46.1 publishes wheels only (no sdist) for manylinux,
    # Windows and macOS 14+ arm64: skip it on Intel macOS so the rest of the
    # extra still installs there (use vlm.load_in_4bit: false). Apple Silicon
    # needs macOS 14+ to resolve it.
    "bitsandbytes>=0.46.1; sys_platform != 'darwin' or platform_machine == 'arm64'",
    # LlamaVisionReporter loads with device_map="auto"; transformers 5.x
    # treats accelerate<1.1.0 as absent.
    "accelerate>=1.1.0",
]

[project.scripts]
glaucoma-screen = "scripts.run_screening:main"
glaucoma-specialist = "scripts.run_specialist:main"

[tool.setuptools.packages.find]
where = ["."]
# `scripts` must ship too: the [project.scripts] entry points import from it.
# `configs` ships (as data-only namespace packages) so the console scripts'
# default --config, resolved relative to scripts/, also exists when installed.
include = ["src*", "scripts*", "configs*"]

[tool.setuptools.package-data]
"configs.tier" = ["*.yaml"]
"configs.model" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F401 is fine in __init__.py files (they re-export public symbols).
# F841 covers locals that are assigned but unused — permit these in tests
# where the binding documents intent.
# Use `select` (not `extend-select`): newer ruff releases ship a much broader
# default rule set, and extending it would silently widen the lint gate.
select = ["E", "F", "W"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
