# Progression forecaster configuration — Phase 4
# Reference: Mass Eye & Ear study (medRxiv, Nov 2025)
# 10,864 patients, AUC 0.97

temporal_encoder:
  backbone: convnextv2_base  # Best performing in reference study
  pretrained: true
  embed_dim: 1024

  # Alternative backbones tested in reference:
  # - vit_base_patch16_224
  # - mobilenetv2_100
  # - efficientnet_b0

forecaster:
  type: bilstm
  hidden_dim: 512
  num_layers: 2
  dropout: 0.3
  num_classes: 2  # stable vs progressing

training:
  epochs: 50
  batch_size: 8
  learning_rate: 1.0e-4
  optimizer: adamw
  weight_decay: 0.01
  scheduler: cosine_with_warmup
  warmup_epochs: 5

data:
  observation_window: 4  # Number of sequential visits
  # Critical: RNFL data is essential (removing it: AUC 0.569)
  # VF data is largely redundant (removing it: AUC 0.975)
  modalities:
    - rnfl_oct  # Primary signal
    - clinical  # IOP, age, demographics
    - visual_field  # Optional, minimal impact on AUC
