# FunduSAM configuration — Phase 2 fundus segmentation
# Reference: arXiv:2502.06220

model:
  name: fundusam
  sam_checkpoint: null  # Path to SAM ViT-H weights
  num_classes: 3  # background, disc, cup
  use_polar_transform: true

  adapter:
    bottleneck_dim: 64
    # Two adapters per transformer block (PEFT)

  cbam:
    enabled: true
    reduction: 16

training:
  epochs: 100
  batch_size: 4
  learning_rate: 1.0e-4
  optimizer: adamw
  weight_decay: 0.01
  scheduler: cosine

  # Joint loss: CE for OD + CE for OC + structural constraint
  loss:
    ce_weight: 1.0
    structural_constraint_weight: 0.5

data:
  image_size: 512
  polar_output_size: [256, 512]  # [radial, angular]
