# Tier 1: Screening deployment configuration (GlaucoMamba)
# Target: Rural clinics, community camps, mobile health
# Input: Single fundus photograph
# Latency: <5s CPU, <1s GPU

tier: screening

pipeline:
  device: cpu
  baseline_mode: false  # Set true for vCDR-only baseline comparison
  referral_threshold: 0.5
  vcdr_alert_threshold: 0.65

segmentation:
  model: boundary_former
  num_classes: 3  # background, disc, cup
  base_channels: 64
  growth_rate: 32
  checkpoint: null  # Path to trained BoundaryFormer weights
  image_size: 512
  # Optional polar preprocessing (PMC12469222-style). Set true to train
  # BoundaryFormer on polar-warped fundus photos — disc/cup boundaries
  # become near-horizontal strips that are easier to delineate.
  polar: false

feature_extraction:
  model: dinov2_vitb14
  variant: dinov2_vitb14  # AUC 0.958 for glaucoma (vs RETFound 0.940)
  embed_dim: 768  # DINOv2-Base output dim (vs RETFound 1024)
  freeze_encoder: true
  # true selects the register-token backbone (torch.hub "<variant>_reg"; cleaner
  # attention maps) whose features differ from the plain one's. The
  # scripts/train_*.py trainers fit heads on the plain backbone, so keep false
  # unless your checkpoints were trained on register features.
  use_registers: false
  image_size: 224

classifier:
  type: linear
  input_dim: 768  # DINOv2-Base dim
  checkpoint: null  # Path to trained classifier head weights

fairness:
  enabled: true
  model: equity_attention
  num_groups: 3  # Asian, Black, White (per Harvard-GF)
  adversarial_weight: 0.1
  checkpoint: null

explainability:
  gradcam: true  # DINOv2 self-attention maps for visual explanation
  vcdr_display: true  # Always show vCDR as clinically grounded metric

output:
  save_overlay: true
  save_referral_json: true
  save_attention_map: true
  output_dir: outputs/screening/
